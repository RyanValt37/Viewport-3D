name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest.github/workflow/build.yml
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Viewport3D.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: Viewport3D
      - uses: actions/upload-artifact@v4
        with:
          name: Viewport3D-debug-apk
          path: Viewport3D/app/build/outputs/apk/debug/*.apk
